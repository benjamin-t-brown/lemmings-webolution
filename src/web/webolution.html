<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lemmings Webolution</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; }
  body { margin: 0; background: #141414; }
  main {
    min-height: 100vh; min-height: 100dvh;
    width: max-content; min-width: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1rem;
  }
  button { padding: .6rem 1.4rem; font: inherit; cursor: pointer; }
  /* Clone addition. Preset canvas widths use CSS pixels and may require scrolling. */
  canvas {
    display: block;
    width: min(100vw, calc(100vh * 4 / 3));
    width: min(100dvw, calc(100dvh * 4 / 3));
    height: auto; aspect-ratio: 4 / 3; image-rendering: pixelated;
  }
  canvas[data-window-scale="1"] { width: 640px; }
  canvas[data-window-scale="2"] { width: 1280px; }
  canvas[data-window-scale="3"] { width: 1920px; }
  canvas:focus { outline: none; }
  [hidden] { display: none; }
</style>
<main>
  <output id="status" role="status">Loading game…</output>
  <button id="start" type="button" hidden>Start game</button>
  <canvas id="canvas" width="640" height="480" tabindex="0" aria-label="Lemmings Webolution" hidden></canvas>
</main>
<script>
  const statusLine = document.querySelector('#status');
  const startButton = document.querySelector('#start');
  const canvas = document.querySelector('#canvas');
  let lastDiagnostic = '';
  // Keep the last error for the exit screen even after console output is full.
  const reported = new Set();
  function reportOnce(text, write) {
    if (reported.size >= 32 || reported.has(text)) return;
    reported.add(text);
    write(text);
  }
  canvas.addEventListener('contextmenu', event => event.preventDefault());
  // SDL button events reuse the last pointer position. Refresh it after scroll or resize
  // changes the canvas position under a stationary pointer.
  function refreshMousePosition(event) {
    if (document.pointerLockElement === canvas) return;
    canvas.dispatchEvent(new MouseEvent('mousemove', {
      clientX: event.clientX, clientY: event.clientY, buttons: event.buttons,
    }));
  }
  canvas.addEventListener('mousedown', refreshMousePosition, true);
  canvas.addEventListener('mouseup', refreshMousePosition, true);
  canvas.addEventListener('keydown', event => {
    if (event.key === 'F11') event.stopPropagation();
  });
  function message(text) {
    statusLine.hidden = false;
    statusLine.textContent = text;
  }
  async function prepare() {
    const { FS, IDBFS } = Module;
    FS.mkdir('/store');
    FS.mount(IDBFS, {}, '/store');
    await new Promise((resolve, reject) =>
      FS.syncfs(true, error => error ? reject(error) : resolve()));

    FS.mkdir('/game');
    for (const name of ['lemmings.box', 'patch.box']) {
      message('Loading ' + name + '…');
      const response = await fetch('/game/' + name);
      if (!response.ok) throw new Error(name + ' — HTTP ' + response.status);
      const bytes = new Uint8Array(await response.arrayBuffer());
      FS.writeFile('/game/' + name, bytes, {canOwn: true});
      FS.chmod('/game/' + name, 0o444);
    }
    statusLine.hidden = true;
    startButton.hidden = false;
    startButton.focus();
    startButton.onclick = async () => {
      startButton.hidden = true;
      canvas.hidden = false;
      canvas.focus();
      try {
        // Open audio in the click gesture and hold the save lock until main returns across Asyncify yields.
        const code = await Module.ccall('main', 'number', ['number', 'number'], [0, 0], {async: true});
        if (code === 0) message('Game closed. Reload to play again.');
        else message(lastDiagnostic || 'Game exited with code ' + code + '.');
      } catch (error) {
        message('Game stopped. ' + error);
      } finally {
        releaseStore();
      }
    };
  }
  let releaseStore;
  var Module = {
    canvas, noInitialRun: true,
    preRun() {
      // libc snapshots the environment on first use, including in constructors.
      Module.ENV.XDG_DATA_HOME = '/store';
      Module.ENV.WEBOLUTION_GAME_DIR = '/game';
      Module.ENV.SDL_EMSCRIPTEN_ASYNCIFY = '0'; // The game yields once per frame.
    },
    async onRuntimeInitialized() {
      try {
        // Lock the IDBFS save tree so two tabs cannot sync over each other.
        await navigator.locks.request('webolution-save', {ifAvailable: true}, async lock => {
          if (!lock) throw new Error('Close the other game tab and reload.');
          const finished = new Promise(resolve => { releaseStore = resolve; });
          await prepare();
          await finished;
        });
      } catch (error) { message('Cannot start game. ' + error); }
    },
    print(text) { reportOnce(text, console.log); },
    printErr(text) {
      lastDiagnostic = text;
      reportOnce(text, console.error);
      if (/^(save:|sound settings:)/.test(text)) message(text);
    },
    onAbort(reason) { message('Game stopped. ' + reason); releaseStore?.(); }
  };
</script>
<script src="webolution.js" onerror="message('Could not load webolution.js.')"></script>
</html>
